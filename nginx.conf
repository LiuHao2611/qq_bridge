server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA history 回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 反代后端 API
    location /api/v1/ {
        proxy_pass http://backend:7788;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # 上传/产出文件
    location /file/  { proxy_pass http://backend:7788; }
    location /uploads/ { proxy_pass http://backend:7788; }
}
