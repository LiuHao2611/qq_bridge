[project]
name = "qq-bridge"
version = "0.2.0"
description = "manju_agent 的 QQ 接入桥接层（NoneBot2 + OneBot V11），仅经 HTTP 调用主项目能力"
requires-python = ">=3.10"
dependencies = [
    "nonebot2[fastapi,httpx,websockets]>=2.4",
    "nonebot-adapter-onebot>=2.4",
    "python-dotenv>=1.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 默认不跑 e2e（test_e2e_ws.py 会启动真实 bot.py 子进程并阻塞等端口，易卡死）。
# 需要跑端到端时显式：pytest -m e2e
# --timeout=60：任何用例卡死 60s 自动判失败并退出，不再需要手动关闭进程。
addopts = ["-m", "not e2e and not live", "--timeout=60"]
markers = [
    "e2e: 启动真实 bridge 子进程(bot.py)的端到端测试，耗时且可能占端口，默认不跑；需运行时加 -m e2e",
    "slow: 真实生图/真实服务依赖的慢测试，默认跑但内部自判环境跳过",
    "live: 真连真实 Home Assistant 的验收测试，有真实开关设备副作用，默认不跑；需显式 pytest -m live 并提供 HA_TEST_URL/HA_TEST_TOKEN/HA_TEST_ENTITY 环境变量",
]
